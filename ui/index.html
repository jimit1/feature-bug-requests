<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature / Bug Requests</title>
<style>
:root { --ink:#2C2C2A; --muted:#5F5E5A; --faint:#888780; --line:#D3D1C7; --tint:#F2F0EA; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; color:var(--ink); -webkit-font-smoothing:antialiased;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
h1 { margin:0; font-size:24px; font-weight:600; letter-spacing:-0.01em; }
.btn { padding:7px 15px; border:1px solid var(--line); border-radius:3px; background:none;
  font:inherit; font-size:13px; color:var(--ink); cursor:pointer; }
.btn:hover { background:#FBFAF8; }
.gate { max-width:340px; margin:0 auto; padding:17vh 24px 0; }
.gate[hidden] { display:none; }
.gate h1 { font-size:22px; }
.gatenote { margin:10px 0 26px; color:var(--muted); font-size:14px; }
.gateform { display:flex; gap:10px; align-items:center; }
.gateerr { min-height:19px; margin:16px 0 0; color:#791F1F; font-size:13px; }
input { padding:9px 0; border:0; border-bottom:1px solid var(--line); background:none;
  font:inherit; font-size:14px; color:var(--ink); }
input::placeholder { color:var(--faint); }
input:focus { outline:none; border-bottom-color:var(--ink); }
.gateform input, .composer input { flex:1 1 auto; min-width:0; }
.page { display:flex; gap:44px; align-items:flex-start;
  max-width:1420px; margin:0 auto; padding:52px 32px 96px; }
.page[hidden] { display:none; }
.digest { flex:1 1 auto; min-width:0; }
.gen { margin:8px 0 0; color:var(--faint); font-size:13px; }
.stats { display:flex; flex-wrap:wrap; gap:40px; margin-top:26px; }
.stat b { display:block; font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
.stat span { display:block; margin-top:3px; color:var(--faint); font-size:11px;
  letter-spacing:0.09em; text-transform:uppercase; }
.filters { display:flex; flex-wrap:wrap; gap:36px; margin-top:30px; padding:22px 0;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.flabel { display:block; margin-bottom:9px; color:var(--faint); font-size:11px;
  letter-spacing:0.09em; text-transform:uppercase; }
.opt { margin:0 18px 0 0; padding:0 0 2px; border:0; border-bottom:1px solid transparent;
  background:none; font:inherit; font-size:14px; color:var(--muted); cursor:pointer; }
.opt:last-child { margin-right:0; }
.opt[aria-pressed="true"] { color:var(--ink); font-weight:600; border-bottom-color:var(--ink); }
.head, .row { display:grid; gap:14px; align-items:baseline;
  grid-template-columns:26px minmax(0,1fr) 74px 116px 44px 92px 76px 54px; }
.head { padding:16px 6px 10px; border-bottom:1px solid var(--line); color:var(--faint);
  font-size:10.5px; letter-spacing:0.07em; text-transform:uppercase; }
.head span { white-space:nowrap; }
.head span:last-child { text-align:right; }
.row { width:100%; padding:16px 6px; text-align:left; background:none; color:inherit;
  font:inherit; border:0; border-bottom:1px solid var(--line); cursor:pointer; }
.row:hover { background:#FBFAF8; }
.rank { color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums; }
.cell { min-width:0; }
.title { display:block; font-size:16px; }
.sub { display:block; margin-top:4px; color:var(--muted); font-size:13px;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.row[aria-expanded="true"] .sub { display:none; }
.summary { max-width:64ch; margin:0 0 18px; }
.accts, .num, .srcs, .when { color:var(--muted); font-size:13px; }
.num { font-variant-numeric:tabular-nums; }
.score { font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.bar { display:block; width:60px; height:3px; margin:7px 0 0 auto; background:#E5E3DA; }
.bar i { display:block; height:100%; background:var(--ink); }
.pill { justify-self:start; padding:3px 8px; border-radius:3px; font-size:11px;
  letter-spacing:0.06em; text-transform:uppercase; }
.bug { background:#FCEBEB; color:#791F1F; }
.feature { background:#EEEDFE; color:#3C3489; }
.detail { padding:6px 6px 34px 44px; border-bottom:1px solid var(--line); }
.math { margin:0 0 26px; overflow-x:auto; white-space:nowrap; color:var(--muted);
  font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.claim { max-width:66ch; margin:0 0 22px; padding-left:16px; border-left:2px solid var(--line); }
.quote { margin:0 0 9px; }
.meta { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center;
  color:var(--muted); font-size:13px; }
.who { color:var(--ink); }
.tag { padding:2px 7px; border-radius:3px; font-size:12px; }
.customer { background:#FAECE7; color:#D85A30; }
.prospect { border:1px solid var(--line); color:var(--muted); }
.src { padding:2px 7px; border-radius:3px; background:#E6F1FB; color:#185FA5;
  font-size:12.5px; text-decoration:underline; text-underline-offset:2px; }
.log { max-width:92ch; margin-top:26px; padding-top:14px; border-top:1px solid var(--line);
  color:var(--faint); font-size:12.5px; }
.log div { margin-top:5px; }
.empty { padding:30px 6px; color:var(--muted); }
.spot { display:flex; flex-wrap:wrap; gap:12px; align-items:baseline;
  margin:0; padding:16px 6px 0; color:var(--muted); font-size:13px; }
.spot button { padding:0; border:0; background:none; font:inherit; font-size:13px;
  color:#185FA5; text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
.ask { flex:0 0 400px; display:flex; flex-direction:column; position:sticky; top:24px;
  max-height:calc(100vh - 48px); padding-left:28px; border-left:1px solid var(--line); }
.ask[hidden] { display:none; }
.asktitle { margin:0; font-size:13px; font-weight:600; }
.asknote { margin:5px 0 20px; color:var(--faint); font-size:12.5px; }
.thread { flex:1 1 auto; min-height:0; overflow-y:auto; padding-bottom:20px; }
.chip { display:block; width:100%; margin-bottom:9px; padding:9px 13px; text-align:left;
  border:1px solid var(--line); border-radius:13px; background:none; font:inherit;
  font-size:13.5px; color:var(--muted); cursor:pointer; }
.chip:hover { background:#FBFAF8; color:var(--ink); }
.turn + .turn { margin-top:24px; }
.bubble { max-width:88%; margin-left:auto; padding:9px 13px; font-size:14px;
  border-radius:13px 13px 3px 13px; background:var(--tint); }
.atext { margin:13px 2px 0; font-size:14px; line-height:1.6; white-space:pre-wrap; }
.atext.err { color:#791F1F; }
.pending { display:inline-block; margin-top:13px; padding:8px 13px; color:var(--muted);
  font-size:13.5px; border-radius:13px 13px 13px 3px; background:var(--tint); }
.composer { display:flex; gap:10px; align-items:center;
  padding-top:14px; border-top:1px solid var(--line); }
@media (max-width:900px) {
  .page { display:block; padding:44px 24px 80px; }
  .head { display:none; }
  .row { grid-template-columns:24px minmax(0,1fr) 84px 52px; }
  .row .accts, .row .num, .row .srcs, .row .when { display:none; }
  .detail { padding-left:24px; }
  .ask { position:static; max-height:none; margin-top:44px; padding:26px 0 0;
    border-left:0; border-top:1px solid var(--line); }
  .thread { overflow:visible; }
}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <h1>Feature / Bug Requests</h1>
  <p class="gatenote">Enter the passphrase from the email</p>
  <form class="gateform" id="gateform">
    <input id="gpass" type="password" placeholder="Passphrase" autocomplete="current-password">
    <button class="btn" type="submit">Open</button>
  </form>
  <p class="gateerr" id="gateerr"></p>
</div>
<div class="page" id="page">
 <div class="digest">
  <h1>Feature / Bug Requests</h1>
  <p class="gen" id="gen"></p>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters">
    <div>
      <span class="flabel">Type</span>
      <button class="opt" data-f="type" data-v="all">All</button
      ><button class="opt" data-f="type" data-v="bug">Bug</button
      ><button class="opt" data-f="type" data-v="feature">Feature</button>
    </div>
    <div>
      <span class="flabel">Audience</span>
      <button class="opt" data-f="aud" data-v="all">All</button
      ><button class="opt" data-f="aud" data-v="customer">Customers</button
      ><button class="opt" data-f="aud" data-v="prospect">Prospects</button>
    </div>
    <div>
      <span class="flabel">Window</span>
      <button class="opt" data-f="win" data-v="7">Last 7 days</button
      ><button class="opt" data-f="win" data-v="30">Last 30 days</button
      ><button class="opt" data-f="win" data-v="all">All time</button>
    </div>
  </div>
  <div id="spot"></div>
  <div class="head">
   <span>#</span><span>Theme</span><span>Type</span><span>Accounts</span>
   <span>Cases</span><span>Sources</span><span>Last heard</span><span>Score</span>
  </div>
  <div id="list"></div>
 </div>
 <aside class="ask" id="ask" hidden>
  <p class="asktitle">Ask</p>
  <p class="asknote">Answers come only from the themes and quotes on this page.</p>
  <div class="thread" id="thread"></div>
  <form class="composer" id="composer">
   <input id="q" type="text" maxlength="500" placeholder="Ask about these themes">
   <button class="btn" type="submit">Send</button>
  </form>
 </aside>
</div>
<script src="data.js"></script>
<script>
(function () {
  var D = window.DIGEST, F = { type: "all", aud: "all", win: "all" };
  var open = {}, spot = null, turns = [], pass = "";
  var list = document.getElementById("list"), note = document.getElementById("spot");
  var gate = document.getElementById("gate"), page = document.getElementById("page");
  var gpass = document.getElementById("gpass"), gerr = document.getElementById("gateerr");
  var pane = document.getElementById("ask"), qbox = document.getElementById("q");
  var thread = document.getElementById("thread");
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var CHIPS = ["What should we fix first?", "What are prospects asking for?",
    "Which bug affects the most accounts?"];
  var HEADERS = { "content-type": "application/json" };
  var q = (location.search.match(/[?&]open=([^&]+)/) || [])[1];
  if (q) { open[decodeURIComponent(q)] = 1; }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
    });
  }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
  function parts(d) { var p = d.split("-"); return [+p[0], +p[1], +p[2]]; }
  function fday(d) { var p = parts(d); return MON[p[1] - 1] + " " + p[2]; }
  function fdate(d) { var p = parts(d); return MON[p[1] - 1] + " " + p[2] + ", " + p[0]; }
  function age(d) {
    var a = parts(d), b = parts(D.as_of);
    return Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
  }
  function keep(c) {
    if (F.aud !== "all" && c.account_type !== F.aud) { return false; }
    if (F.win !== "all" && age(c.day) > +F.win) { return false; }
    return true;
  }
  function accounts(claims) {
    var seen = { customer: {}, prospect: {} }, out = [];
    claims.forEach(function (c) { var b = seen[c.account_type]; if (b) { b[c.account_id] = 1; } });
    var cu = Object.keys(seen.customer).length, pr = Object.keys(seen.prospect).length;
    if (cu) { out.push(plural(cu, "customer")); }
    if (pr) { out.push(plural(pr, "prospect")); }
    return out.join(", ");
  }
  function sources(claims) {
    var calls = {}, cases = {}, out = [];
    claims.forEach(function (c) {
      var l = c.locator;
      if (l.call_id) { calls[l.call_id] = 1; } else { cases[l.case_id] = 1; }
    });
    var a = Object.keys(calls).length, b = Object.keys(cases).length;
    if (a) { out.push(plural(a, "call")); }
    if (b) { out.push(plural(b, "case")); }
    return out.join(", ");
  }
  function lastHeard(claims) {
    return fday(claims.map(function (c) { return c.day; }).sort().pop());
  }
  function math(t) {
    return Object.keys(t.score_parts).map(function (k) {
      return k + " " + t.score_parts[k].toFixed(1);
    }).join(" + ") + " = " + t.score;
  }
  function source(c) {
    var l = c.locator;
    if (l.call_id) {
      var s = Math.floor(l.start_ms / 1000);
      return "call " + l.call_id + " at " + Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
    }
    return "case " + (l.case_number || l.case_id) + ", comment " + l.comment_id;
  }
  function claimHtml(c) {
    var tag = c.account_type === "customer" ? "customer" : "prospect";
    return '<div class="claim"><p class="quote">“' + esc(c.quote) + '”</p>' +
      '<p class="meta"><span class="who">' + esc(c.account) + '</span>' +
      '<span class="tag ' + tag + '">' + tag + '</span>' +
      '<span>' + esc(c.speaker) + '</span><span>' + fday(c.day) + '</span>' +
      '<span class="src">' + esc(source(c)) + '</span></p></div>';
  }
  function detailHtml(t, claims) {
    var logs = (t.log || []).map(function (e) {
      return '<div>' + fday(e.day) + " &middot; " + esc(e.action) + " &middot; " + esc(e.why) + '</div>';
    }).join("");
    return '<div class="detail"><p class="summary">' + esc(t.summary) + '</p>' +
      '<p class="math">' + esc(math(t)) + '</p>' +
      claims.map(claimHtml).join("") +
      (logs ? '<div class="log">' + logs + '</div>' : "") + '</div>';
  }
  function rowHtml(v, i, top) {
    var t = v.t, isOpen = !!open[t.id];
    return '<button class="row" data-id="' + esc(t.id) + '" aria-expanded="' + isOpen + '">' +
      '<span class="rank">' + (i + 1) + '</span>' +
      '<span class="cell"><span class="title">' + esc(t.title) + '</span>' +
      '<span class="sub">' + esc(t.summary) + '</span></span>' +
      '<span class="pill ' + esc(t.type) + '">' + esc(t.type) + '</span>' +
      '<span class="accts">' + accounts(v.claims) + '</span>' +
      '<span class="num">' + (t.open_cases || 0) + '</span>' +
      '<span class="srcs">' + sources(v.claims) + '</span>' +
      '<span class="when">' + lastHeard(v.claims) + '</span>' +
      '<span class="score">' + t.score + '<span class="bar"><i style="width:' +
      Math.round(t.score / top * 100) + '%"></i></span></span>' +
      '</button>' + (isOpen ? detailHtml(t, v.claims) : "");
  }
  function spotted(t) { return spot && spot.indexOf(t.id) > -1; }
  function drawNote() {
    if (!spot) { note.innerHTML = ""; return; }
    var n = D.themes.filter(spotted).length;
    note.innerHTML = '<p class="spot"><span>Showing the ' +
      (n === 1 ? "theme" : n + " themes") + ' this answer drew on</span>' +
      '<button id="showall">show all</button></p>';
  }
  function render() {
    var vis = [];
    drawNote();
    D.themes.slice().sort(function (a, b) { return b.score - a.score; }).forEach(function (t) {
      if (spot && !spotted(t)) { return; }
      if (F.type !== "all" && t.type !== F.type) { return; }
      var claims = (t.claims || []).filter(keep);
      if (claims.length) { vis.push({ t: t, claims: claims }); }
    });
    var top = vis.length ? vis[0].t.score || 1 : 1;
    list.innerHTML = vis.map(function (v, i) { return rowHtml(v, i, top); }).join("") ||
      '<p class="empty">No themes match these filters. Widen the window or clear a filter.</p>';
  }
  function pressed() {
    [].forEach.call(document.querySelectorAll(".opt"), function (o) {
      o.setAttribute("aria-pressed", F[o.dataset.f] === o.dataset.v);
    });
  }
  function drawStats() {
    var claims = 0, accts = {};
    D.themes.forEach(function (t) {
      (t.claims || []).forEach(function (c) { claims++; accts[c.account_id] = 1; });
    });
    document.getElementById("stats").innerHTML = [
      [D.themes.length, "themes"], [claims, "claims"],
      [Object.keys(accts).length, "accounts"], [D.days.length, "days"]
    ].map(function (s) {
      return '<div class="stat"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>';
    }).join("");
  }
  function drawThread() {
    if (!turns.length) {
      thread.innerHTML = CHIPS.map(function (c) {
        return '<button class="chip" type="button">' + esc(c) + '</button>';
      }).join("");
      return;
    }
    thread.innerHTML = turns.map(function (t) {
      var answer = t.pending ? '<div class="pending">Thinking...</div>'
        : '<div class="atext' + (t.err ? " err" : "") + '">' + esc(t.a) + '</div>';
      return '<div class="turn"><div class="bubble">' + esc(t.q) + '</div>' + answer + '</div>';
    }).join("");
    thread.scrollTop = thread.scrollHeight;
  }
  function lock(message) {
    pass = "";
    try { localStorage.removeItem("fbr_pass"); } catch (e) {}
    gpass.value = "";
    gerr.textContent = message || "";
    page.hidden = true;
    gate.hidden = false;
  }
  function doAsk(text) {
    var question = (text || qbox.value).trim();
    if (!question) { return; }
    qbox.value = "";
    var turn = { q: question, a: "", pending: 1 };
    turns.push(turn);
    drawThread();
    fetch(D.ask_url, {
      method: "POST", headers: HEADERS,
      body: JSON.stringify({ question: question, passphrase: pass })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (r.status === 403) { throw { locked: 1 }; }
        if (!r.ok) { throw new Error(j.error || "request failed"); }
        return j;
      });
    }).then(function (j) {
      turn.pending = 0;
      turn.a = j.answer || "";
      spot = j.themes && j.themes.length ? j.themes : null;
      if (spot) { open = {}; spot.forEach(function (id) { open[id] = 1; }); }
      drawThread();
      render();
    }).catch(function (e) {
      if (e && e.locked) { turns.pop(); drawThread(); lock("Wrong passphrase"); return; }
      turn.pending = 0;
      turn.a = "Could not answer: " + e.message;
      turn.err = 1;
      drawThread();
    });
  }
  document.getElementById("gateform").addEventListener("submit", function (e) {
    e.preventDefault();
    var value = gpass.value.trim();
    if (!value) { return; }
    gerr.textContent = "Checking...";
    fetch(D.ask_url, {
      method: "POST", headers: HEADERS,
      body: JSON.stringify({ question: "", passphrase: value })
    }).then(function (r) {
      return r.json().then(function (j) { return { code: r.status, body: j }; });
    }).then(function (res) {
      if (res.code === 400) {
        pass = value;
        try { localStorage.setItem("fbr_pass", value); } catch (e) {}
        gerr.textContent = "";
        gate.hidden = true;
        page.hidden = false;
        return;
      }
      gerr.textContent = res.code === 403 ? "Wrong passphrase"
        : res.body.error || "Could not check the passphrase";
    }).catch(function (e) {
      gerr.textContent = "Could not check the passphrase: " + e.message;
    });
  });
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest(".opt");
    if (!b) { return; }
    F[b.dataset.f] = b.dataset.v;
    pressed();
    render();
  });
  list.addEventListener("click", function (e) {
    var r = e.target.closest(".row");
    if (!r) { return; }
    var id = r.dataset.id;
    if (open[id]) { delete open[id]; } else { open[id] = 1; }
    render();
  });
  note.addEventListener("click", function (e) {
    if (e.target.id === "showall") { spot = null; render(); }
  });
  thread.addEventListener("click", function (e) {
    if (e.target.classList.contains("chip")) { doAsk(e.target.textContent); }
  });
  document.getElementById("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    doAsk();
  });
  if (D.ask_url) {
    pane.hidden = false;
    try { pass = localStorage.getItem("fbr_pass") || ""; } catch (e) {}
    if (!pass) { page.hidden = true; gate.hidden = false; }
    drawThread();
  }
  document.getElementById("gen").textContent = "As of " + fdate(D.as_of) +
    ", from " + D.days.length + " days of calls and cases";
  drawStats();
  pressed();
  render();
})();
</script>
</body>
</html>
