<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature / Bug Requests</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
:root {
  --ink:#17151F; --violet:#5B4FE0; --haze:#EDEBFB; --ground:#F6F5FA;
  --ember:#C0442B; --sea:#12715F;
  --line:#E3E1EC; --mute:#6B6878; --faint:#9694A6; --edge:#D8D4F5;
  --s1:#ADA6F1; --s2:#8279EB; --s3:#5B4FE0; --s4:#3B31A8; --s5:#C0442B;
  --ui:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --voice:"Source Serif 4",Georgia,"Times New Roman",serif;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
  font:15px/1.55 var(--ui); -webkit-font-smoothing:antialiased; }
.rank, .score, .total, .part span:last-child { font-variant-numeric:tabular-nums; }
h1, h2, h3 { margin:0; font-weight:600; letter-spacing:-0.015em; }
p { margin:0; }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--violet); outline-offset:2px; border-radius:3px; }
.mark { width:30px; height:33px; flex:0 0 auto; color:var(--violet); }
.mark.sm { width:20px; height:22px; }
.mark.lg { width:52px; height:57px; }

/* gate */
.gate { max-width:440px; margin:0 auto; padding:14vh 24px 0; }
.gate[hidden], .page[hidden], .agent[hidden] { display:none; }
.gatecard { padding:30px 30px 26px; border:1px solid var(--edge); border-radius:20px;
  background:var(--haze); }
.gate h1 { margin:18px 0 8px; font-size:27px; }
.gatenote { margin-bottom:24px; color:var(--mute); }
.gateform { display:flex; gap:10px; align-items:stretch; }
.gatekeep { margin-top:14px; color:#55507A; font-size:13px; }
.gateerr { min-height:20px; margin-top:6px; color:var(--ember); font-size:13.5px; }

.field { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
  background:#fff; font:400 14.5px var(--ui); color:var(--ink); }
.field::placeholder { color:var(--faint); }
.field:focus { border-color:var(--violet); outline:none; }
.send { padding:11px 20px; border:0; border-radius:10px; background:var(--violet);
  color:#fff; font:600 14px var(--ui); cursor:pointer; }
.send:hover { background:#4A3ED2; }

/* page frame */
.page { max-width:1300px; margin:0 auto; padding:44px 30px 90px; }
.masthead { display:flex; flex-wrap:wrap; gap:8px 28px; align-items:baseline;
  justify-content:space-between; padding-bottom:22px; }
.masthead h1 { font-size:33px; }
.lede { color:var(--mute); font-size:15px; }

/* agent */
.agent { margin-bottom:26px; padding:20px 22px 18px; border:1px solid var(--edge);
  border-radius:20px; background:var(--haze); }
.agenthead { display:flex; gap:14px; align-items:center; }
.agentname { font-size:17px; font-weight:600; }
.agentnote { margin-top:2px; color:#55507A; font-size:13.5px; }
.restart { margin-left:auto; white-space:nowrap; padding:8px 15px; border:1px solid var(--violet);
  border-radius:9px; background:#fff; font-weight:500; font-size:13.5px;
  color:var(--violet); cursor:pointer; }
.restart:hover { background:var(--violet); color:#fff; }
.thread { max-height:330px; overflow-y:auto; margin-top:16px; }
.starters { display:flex; flex-wrap:wrap; gap:9px; }
.chip { padding:8px 15px; border:1px solid var(--edge); border-radius:999px;
  background:#fff; font-size:13.5px; cursor:pointer; }
.chip:hover { border-color:var(--violet); color:var(--violet); }
.turn + .turn { margin-top:18px; }
.you { max-width:62ch; margin-left:auto; padding:9px 15px; width:fit-content;
  border-radius:12px 12px 3px 12px; background:#fff; border:1px solid var(--edge);
  font-size:14.5px; }
.said { display:flex; gap:12px; align-items:flex-start; margin-top:12px; max-width:78ch; }
.atext { padding-top:4px; font-size:15px; line-height:1.62; white-space:pre-wrap; }
.atext.err { color:var(--ember); }
.dots span { display:inline-block; width:6px; height:6px; margin-right:4px;
  border-radius:50%; background:var(--violet); opacity:.3;
  animation:blink 1.1s infinite; }
.dots span:nth-child(2) { animation-delay:.16s; }
.dots span:nth-child(3) { animation-delay:.32s; }
@keyframes blink { 40% { opacity:1; } }
.composer { display:flex; gap:10px; margin-top:16px; }
.composer .field { border-color:var(--edge); }

/* filters */
.filters { display:flex; flex-wrap:wrap; gap:12px 26px; align-items:center;
  margin-bottom:14px; }
.fgroup { display:flex; gap:8px; align-items:center; }
.flabel { color:var(--faint); font-size:13px; }
.opt { padding:6px 13px; border:1px solid var(--line); border-radius:999px;
  background:#fff; font-size:13.5px; color:var(--mute); cursor:pointer; }
.opt:hover { border-color:var(--violet); color:var(--violet); }
.opt[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
.key { display:flex; flex-wrap:wrap; gap:6px 13px; align-items:center;
  margin-left:auto; color:var(--faint); font-size:12.5px; }
.key b { font-weight:400; color:var(--mute); }
.key i { display:inline-block; width:9px; height:9px; margin-right:5px;
  border-radius:2px; vertical-align:-1px; }

/* spotlight */
.spot { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center;
  margin-bottom:14px; padding:11px 16px; border:1px solid var(--edge);
  border-left:3px solid var(--violet); border-radius:12px; background:var(--haze);
  font-size:14px; }
.spot button { margin-left:auto; padding:6px 13px; border:1px solid var(--violet);
  border-radius:8px; background:#fff; font-size:13.5px; font-weight:500;
  color:var(--violet); cursor:pointer; }
.spot button:hover { background:var(--violet); color:#fff; }

/* table */
.table { border:1px solid var(--line); border-radius:16px; background:#fff;
  overflow:hidden; }
.head, .row { display:grid; gap:16px; align-items:center;
  grid-template-columns:40px minmax(0,1fr) 92px 128px 82px 112px 88px 116px; }
.head { padding:13px 22px; border-bottom:1px solid var(--line); background:#FBFBFE;
  color:var(--faint); font-size:12.5px; }
.head span:last-child, .score { text-align:right; }
.row { width:100%; padding:15px 22px; text-align:left; background:none; border:0;
  border-bottom:1px solid var(--line); cursor:pointer; }
.list > div:last-child .row, .list > div:last-child .detail { border-bottom:0; }
.row:hover { background:#FAFAFE; }
.row[aria-expanded="true"] { background:#F8F7FE; }
.rank { color:var(--faint); font-size:14px; }
.cell { min-width:0; }
.title { display:block; font-size:16.5px; font-weight:500; line-height:1.35; }
.sub { display:block; margin-top:4px; color:var(--mute); font-size:13.5px;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.row[aria-expanded="true"] .sub { display:none; }
.col { color:var(--mute); font-size:13.5px; }
.tmark { justify-self:start; padding:4px 10px; border-radius:7px; font-size:12.5px; }
.tmark i { display:inline-block; width:6px; height:6px; margin-right:6px;
  border-radius:50%; vertical-align:1px; }
.bug { background:#FAEDE9; color:#93301C; }
.bug i { background:var(--ember); }
.feature { background:#E6F1EE; color:#0C5546; }
.feature i { background:var(--sea); }
.score { font-size:17px; font-weight:600; }
.spine { display:flex; gap:2px; height:6px; margin-top:6px; }
.spine i { display:block; height:100%; border-radius:1px; }
.empty { padding:30px 22px; color:var(--mute); }

/* opened theme */
.detail { padding:6px 22px 30px; border-bottom:1px solid var(--line);
  background:#FBFAFE; animation:reveal .18s ease-out; }
@keyframes reveal { from { opacity:0; transform:translateY(-4px); } }
.band { padding:16px 20px; border:1px solid var(--edge); border-left:3px solid var(--violet);
  border-radius:12px; background:var(--haze); }
.bandtop { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
.band h2 { font-size:21px; line-height:1.25; }
.why { margin-top:7px; color:#55507A; font-size:14px; }
.summary { max-width:78ch; margin:18px 0 22px; color:var(--mute); font-size:14.5px; }
.grid2 { display:grid; grid-template-columns:320px minmax(0,1fr); gap:26px;
  align-items:start; }
.box { padding:16px 18px; border:1px solid var(--line); border-radius:12px; background:#fff; }
.boxhead { display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom:12px; }
.boxhead h3 { font-size:13.5px; font-weight:500; color:var(--mute); }
.total { font-size:22px; font-weight:600; }
.part { display:grid; grid-template-columns:66px minmax(0,1fr) 36px; gap:10px;
  align-items:center; margin-top:8px; font-size:13px; }
.part span:first-child { color:var(--mute); }
.part span:last-child { text-align:right; color:var(--mute); }
.track { height:8px; border-radius:2px; background:#F0EFF7; }
.track i { display:block; height:100%; border-radius:2px; }
.split { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:9px 26px; }
.facts { display:grid; grid-template-columns:96px minmax(0,1fr); gap:9px 14px;
  align-content:start; font-size:13.5px; }
.facts dt { color:var(--faint); }
.facts dd { margin:0; }
.facts dd span { color:var(--mute); }
.acct + .acct { margin-top:7px; }
.acct span { display:block; }

/* evidence */
.sec { display:flex; gap:14px; align-items:baseline; margin:30px 0 14px; }
.sec h3 { font-size:14px; font-weight:600; }
.sec span { color:var(--faint); font-size:13px; }
.sec::after { content:""; flex:1 1 auto; height:1px; background:var(--line); }
.group { margin-bottom:20px; }
.ghead { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline;
  margin-bottom:10px; padding-left:11px; border-left:3px solid var(--line); }
.ghead b { font-size:14.5px; font-weight:600; }
.ghead span { color:var(--mute); font-size:13px; }
.ghead span + span { padding-left:12px; border-left:1px solid #D7D4E2; }
.ghead.cust { border-left-color:var(--violet); }
.cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.card { display:flex; flex-direction:column; padding:15px 17px 13px;
  border:1px solid var(--line); border-radius:12px; background:#fff; }
.quote { font:400 17px/1.5 var(--voice); }
.cmeta { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center;
  margin-top:auto; padding-top:12px; border-top:1px solid #F0EFF5;
  color:var(--mute); font-size:12.5px; }
.cmeta b { font-weight:500; color:var(--ink); }
.srcchip { margin-left:auto; padding:3px 9px; border-radius:6px; background:#F3F2F8;
  color:#4C4959; font-size:12px; }
.srcchip i { font-style:normal; color:var(--faint); }

/* log */
.tl { display:grid; grid-template-columns:62px 12px minmax(0,1fr); gap:0 12px; }
.tl > div { position:relative; padding-bottom:13px; font-size:13.5px; }
.tl .day { color:var(--faint); padding-top:1px; }
.tl .pip::before { content:""; position:absolute; top:6px; left:2px; width:7px;
  height:7px; border-radius:50%; background:var(--violet); }
.tl .pip::after { content:""; position:absolute; top:16px; left:5px; bottom:-1px;
  width:1px; background:var(--line); }
.tl > div:nth-last-child(2).pip::after { display:none; }
.tl .what b { font-weight:600; }
.tl .what span { color:var(--mute); }

@media (max-width:900px) {
  .page { padding:32px 18px 70px; }
  .masthead h1 { font-size:27px; }
  .head { display:none; }
  .row { grid-template-columns:28px minmax(0,1fr) 88px 96px; padding:14px 16px; gap:12px; }
  .row .col { display:none; }
  .detail { padding:6px 16px 26px; }
  .grid2, .cards, .split { grid-template-columns:minmax(0,1fr); }
  .key { margin-left:0; }
  .thread { max-height:none; }
}
@media (prefers-reduced-motion:reduce) {
  * { animation:none !important; transition:none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
 <symbol id="bot" viewBox="0 0 40 44">
  <circle cx="20" cy="3.6" r="3.6" fill="currentColor"/>
  <path d="M20 7.2v4.4" stroke="currentColor" stroke-width="2"/>
  <rect x="4" y="11.6" width="32" height="22" rx="7" fill="var(--haze)"
    stroke="currentColor" stroke-width="2"/>
  <circle cx="14" cy="20.4" r="2.5" fill="currentColor"/>
  <circle cx="26" cy="20.4" r="2.5" fill="currentColor"/>
  <rect x="13" y="26.2" width="14" height="3" rx="1.5" fill="currentColor"/>
  <rect x="12" y="35.4" width="16" height="8.6" rx="3.4" fill="#D3CEF8"
    stroke="currentColor" stroke-width="2"/>
 </symbol>
</svg>

<div class="gate" id="gate" hidden>
 <div class="gatecard">
  <svg class="mark lg"><use href="#bot"/></svg>
  <h1>Feature / Bug Requests</h1>
  <p class="gatenote">Enter the passphrase from the email to open tonight's digest.</p>
  <form class="gateform" id="gateform">
   <input class="field" id="gpass" type="password" placeholder="Passphrase"
     autocomplete="current-password">
   <button class="send" type="submit">Open</button>
  </form>
  <p class="gatekeep">The passphrase is remembered on this device.</p>
  <p class="gateerr" id="gateerr"></p>
 </div>
</div>

<div class="page" id="page">
 <header class="masthead">
  <h1>Feature / Bug Requests</h1>
  <p class="lede" id="lede"></p>
 </header>

 <section class="agent" id="ask" hidden>
  <div class="agenthead">
   <svg class="mark"><use href="#bot"/></svg>
   <div>
    <p class="agentname">Digest agent</p>
    <p class="agentnote" id="agentnote"></p>
   </div>
   <button class="restart" id="restart" type="button">Start over</button>
  </div>
  <div class="thread" id="thread"></div>
  <form class="composer" id="composer">
   <input class="field" id="q" type="text" maxlength="500"
     placeholder="Ask the agent about these themes">
   <button class="send" type="submit">Send</button>
  </form>
 </section>

 <div class="filters" id="filters">
  <div class="fgroup"><span class="flabel">Type</span>
   <button class="opt" data-f="type" data-v="all">All</button>
   <button class="opt" data-f="type" data-v="bug">Bugs</button>
   <button class="opt" data-f="type" data-v="feature">Features</button>
  </div>
  <div class="fgroup"><span class="flabel">Audience</span>
   <button class="opt" data-f="aud" data-v="all">All</button>
   <button class="opt" data-f="aud" data-v="customer">Customers</button>
   <button class="opt" data-f="aud" data-v="prospect">Prospects</button>
  </div>
  <div class="fgroup"><span class="flabel">Window</span>
   <button class="opt" data-f="win" data-v="7">7 days</button>
   <button class="opt" data-f="win" data-v="30">30 days</button>
   <button class="opt" data-f="win" data-v="all">All time</button>
  </div>
  <div class="key" id="key"></div>
 </div>

 <div id="spot"></div>
 <div class="table">
  <div class="head">
   <span>Rank</span><span>Theme</span><span>Type</span><span>Accounts</span>
   <span>Open cases</span><span>Sources</span><span>Last heard</span><span>Score</span>
  </div>
  <div class="list" id="list"></div>
 </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  var D = window.DIGEST, F = { type: "all", aud: "all", win: "all" };
  var open = {}, spot = null, turns = [], done = [], pass = "";
  var list = document.getElementById("list"), note = document.getElementById("spot");
  var gate = document.getElementById("gate"), page = document.getElementById("page");
  var gpass = document.getElementById("gpass"), gerr = document.getElementById("gateerr");
  var pane = document.getElementById("ask"), qbox = document.getElementById("q");
  var thread = document.getElementById("thread");
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var PARTS = ["accounts", "value", "cases", "recency", "bug"];
  var WEIGHT = {
    accounts: "the number of accounts raising it",
    value: "the revenue behind those accounts",
    cases: "its open support cases",
    recency: "how recently it came up",
    bug: "it being a bug"
  };
  var RANK = {};
  var STARTERS = ["What should we fix first?", "What are prospects asking for?",
    "Which bug affects the most accounts?"];
  var HEADERS = { "content-type": "application/json" };
  var BOT = '<svg class="mark sm"><use href="#bot"/></svg>';
  var qs = (location.search.match(/[?&]open=([^&]+)/) || [])[1];
  if (qs) { open[decodeURIComponent(qs)] = 1; }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&quot;";
    });
  }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
  function parts(d) { var p = d.split("-"); return [+p[0], +p[1], +p[2]]; }
  function fday(d) { var p = parts(d); return MON[p[1] - 1] + " " + p[2]; }
  function fdate(d) { var p = parts(d); return MON[p[1] - 1] + " " + p[2] + ", " + p[0]; }
  function money(n) {
    return n >= 1000 ? "$" + Math.round(n / 1000) + "k a year" : "";
  }
  function age(d) {
    var a = parts(d), b = parts(D.as_of);
    return Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
  }
  function keep(c) {
    if (F.aud !== "all" && c.account_type !== F.aud) { return false; }
    if (F.win !== "all" && age(c.day) > +F.win) { return false; }
    return true;
  }
  function uniq(claims, kind) {
    var seen = {}, out = [];
    claims.forEach(function (c) {
      if (c.account_type !== kind || seen[c.account_id]) { return; }
      seen[c.account_id] = 1;
      out.push(c);
    });
    return out.sort(function (a, b) { return b.arr - a.arr; });
  }
  function accounts(claims) {
    var cu = uniq(claims, "customer").length, pr = uniq(claims, "prospect").length, out = [];
    if (cu) { out.push(plural(cu, "customer")); }
    if (pr) { out.push(plural(pr, "prospect")); }
    return out.join(", ");
  }
  function sources(claims) {
    var calls = {}, cases = {}, out = [];
    claims.forEach(function (c) {
      var l = c.locator;
      if (l.call_id) { calls[l.call_id] = 1; } else { cases[l.case_id] = 1; }
    });
    var a = Object.keys(calls).length, b = Object.keys(cases).length;
    if (a) { out.push(plural(a, "call")); }
    if (b) { out.push(plural(b, "case")); }
    return out.join(", ");
  }
  function days(claims) {
    return claims.map(function (c) { return c.day; }).sort();
  }
  function source(c) {
    var l = c.locator;
    if (l.call_id) {
      var s = Math.floor(l.start_ms / 1000);
      return "<i>Call</i> " + esc(l.call_id) + " at " + Math.floor(s / 60) +
        ":" + ("0" + (s % 60)).slice(-2);
    }
    return "<i>Case</i> " + esc(l.case_number || l.case_id) +
      ", comment " + esc(l.comment_id);
  }
  function heaviest(t) {
    var best = PARTS[0];
    PARTS.forEach(function (k) {
      if ((t.score_parts[k] || 0) > (t.score_parts[best] || 0)) { best = k; }
    });
    return best;
  }
  function typeMark(type) {
    return '<span class="tmark ' + esc(type) + '"><i></i>' +
      (type === "bug" ? "Bug" : "Feature") + '</span>';
  }
  function spineHtml(t) {
    return '<span class="spine">' + PARTS.map(function (k, i) {
      var v = t.score_parts[k] || 0;
      return v <= 0 ? "" : '<i style="flex:' + v + ';background:var(--s' + (i + 1) + ')"></i>';
    }).join("") + '</span>';
  }
  function scoreBox(t, cap) {
    return '<div class="box"><div class="boxhead"><h3>Score</h3>' +
      '<span class="total">' + t.score + '</span></div>' +
      PARTS.map(function (k, i) {
        var v = t.score_parts[k] || 0;
        return '<div class="part"><span>' + k + '</span><span class="track">' +
          '<i style="width:' + Math.round(v / cap * 100) + '%;background:var(--s' +
          (i + 1) + ')"></i></span><span>' + v.toFixed(1) + '</span></div>';
      }).join("") + '</div>';
  }
  function ranks() {
    D.themes.slice().sort(function (a, b) { return b.score - a.score; })
      .forEach(function (t, i) { RANK[t.id] = i + 1; });
  }
  function names(claims, kind) {
    var rows = uniq(claims, kind);
    if (!rows.length) { return ""; }
    return '<dt>' + (kind === "customer" ? "Customers" : "Prospects") + '</dt><dd>' +
      rows.map(function (c) {
        var extra = [c.tier];
        if (money(c.arr)) { extra.push(money(c.arr)); }
        return '<div class="acct">' + esc(c.account) + '<span>' +
          esc(extra.join(", ")) + '</span></div>';
      }).join("") + '</dd>';
  }
  function factsBox(t, claims) {
    var d = days(claims);
    return '<div class="box"><div class="boxhead"><h3>Facts</h3></div><div class="split">' +
      '<dl class="facts">' + names(claims, "customer") + names(claims, "prospect") +
      '</dl><dl class="facts"><dt>Open cases</dt><dd>' + (t.open_cases || 0) + '</dd>' +
      '<dt>Sources</dt><dd>' + sources(claims) + '</dd>' +
      '<dt>First heard</dt><dd>' + fday(d[0]) + '</dd>' +
      '<dt>Last heard</dt><dd>' + fday(d[d.length - 1]) + '</dd></dl></div></div>';
  }
  function cardHtml(c) {
    return '<div class="card"><p class="quote">' + esc(c.quote) + '</p>' +
      '<p class="cmeta"><b>' + esc(c.speaker) + '</b><span>' + fday(c.day) + '</span>' +
      '<span class="srcchip">' + source(c) + '</span></p></div>';
  }
  function evidenceHtml(claims) {
    var order = [], by = {};
    claims.forEach(function (c) {
      if (!by[c.account_id]) { by[c.account_id] = []; order.push(c); }
      by[c.account_id].push(c);
    });
    order.sort(function (a, b) {
      return (b.account_type === "customer") - (a.account_type === "customer") ||
        b.arr - a.arr;
    });
    return order.map(function (c) {
      var rows = by[c.account_id];
      var tail = [c.account_type === "customer" ? c.tier + " customer" : "Prospect"];
      if (money(c.arr)) { tail.push(money(c.arr)); }
      tail.push(plural(rows.length, "quote"));
      return '<div class="group"><p class="ghead' +
        (c.account_type === "customer" ? " cust" : "") + '"><b>' + esc(c.account) +
        '</b>' + tail.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join("") +
        '</p>' +
        '<div class="cards">' + rows.map(cardHtml).join("") + '</div></div>';
    }).join("");
  }
  function logHtml(t) {
    var log = t.log || [];
    if (!log.length) { return ""; }
    return '<div class="sec"><h3>How this theme was built</h3><span>' +
      plural(log.length, "step") + ' by the editor</span></div><div class="tl">' +
      log.map(function (e) {
        return '<div class="day">' + fday(e.day) + '</div><div class="pip"></div>' +
          '<div class="what"><b>' +
          (e.action === "open" ? "Opened the theme" : "Added a quote") + '</b> <span>' +
          esc(e.why) + '</span></div>';
      }).join("") + '</div>';
  }
  function detailHtml(t, claims, cap) {
    var d = days(claims);
    var why = "Ranked " + RANK[t.id] + " of " + D.themes.length + " tonight, mostly on " +
      WEIGHT[heaviest(t)] + ", and last heard " + fday(d[d.length - 1]) + ".";
    return '<div class="detail"><div class="band"><div class="bandtop">' +
      '<h2>' + esc(t.title) + '</h2>' + typeMark(t.type) + '</div>' +
      '<p class="why">' + esc(why) + '</p></div>' +
      '<p class="summary">' + esc(t.summary) + '</p>' +
      '<div class="grid2">' + scoreBox(t, cap) + factsBox(t, claims) + '</div>' +
      '<div class="sec"><h3>What people said</h3><span>' +
      plural(claims.length, "quote") + ', in their own words</span></div>' +
      evidenceHtml(claims) + logHtml(t) + '</div>';
  }
  function rowHtml(v, cap) {
    var t = v.t, isOpen = !!open[t.id];
    return '<div><button class="row" data-id="' + esc(t.id) + '" aria-expanded="' +
      isOpen + '"><span class="rank">' + RANK[t.id] + '</span>' +
      '<span class="cell"><span class="title">' + esc(t.title) + '</span>' +
      '<span class="sub">' + esc(t.summary) + '</span></span>' + typeMark(t.type) +
      '<span class="col">' + accounts(v.claims) + '</span>' +
      '<span class="col">' + (t.open_cases || 0) + '</span>' +
      '<span class="col">' + sources(v.claims) + '</span>' +
      '<span class="col">' + fday(days(v.claims).pop()) + '</span>' +
      '<span class="score">' + t.score + spineHtml(t) + '</span></button>' +
      (isOpen ? detailHtml(t, v.claims, cap) : "") + '</div>';
  }
  function spotted(t) { return spot && spot.indexOf(t.id) > -1; }
  function drawNote() {
    if (!spot) { note.innerHTML = ""; return; }
    var n = D.themes.filter(spotted).length;
    note.innerHTML = '<div class="spot">' + BOT + '<span>Showing the ' +
      (n === 1 ? "theme" : n + " themes") + ' behind that answer.</span>' +
      '<button id="showall" type="button">Show all ' + D.themes.length + '</button></div>';
  }
  function render() {
    var vis = [], cap = 1;
    drawNote();
    D.themes.forEach(function (t) {
      PARTS.forEach(function (k) { cap = Math.max(cap, t.score_parts[k] || 0); });
    });
    D.themes.slice().sort(function (a, b) { return b.score - a.score; }).forEach(function (t) {
      if (spot && !spotted(t)) { return; }
      if (F.type !== "all" && t.type !== F.type) { return; }
      var claims = (t.claims || []).filter(keep);
      if (claims.length) { vis.push({ t: t, claims: claims }); }
    });
    list.innerHTML = vis.map(function (v) { return rowHtml(v, cap); }).join("") || '<p class="empty">No themes match these filters. ' +
      'Widen the window or set a filter back to all.</p>';
  }
  function pressed() {
    [].forEach.call(document.querySelectorAll(".opt"), function (o) {
      o.setAttribute("aria-pressed", F[o.dataset.f] === o.dataset.v);
    });
  }
  function counts() {
    var claims = 0, accts = {};
    D.themes.forEach(function (t) {
      (t.claims || []).forEach(function (c) { claims++; accts[c.account_id] = 1; });
    });
    document.getElementById("lede").textContent = plural(D.themes.length, "theme") +
      " from " + plural(claims, "quote") + " across " +
      plural(Object.keys(accts).length, "account") + ", as of " + fdate(D.as_of);
    document.getElementById("agentnote").textContent = "Reads every one of the " +
      claims + " quotes behind these " + D.themes.length +
      " themes, and answers from those only.";
    document.getElementById("key").innerHTML = "<b>Score bar</b>" +
      PARTS.map(function (k, i) {
        return '<span><i style="background:var(--s' + (i + 1) + ')"></i>' + k + '</span>';
      }).join("");
  }
  function drawThread() {
    if (!turns.length) {
      thread.innerHTML = '<div class="starters">' + STARTERS.map(function (c) {
        return '<button class="chip" type="button">' + esc(c) + '</button>';
      }).join("") + '</div>';
      return;
    }
    thread.innerHTML = turns.map(function (t) {
      var answer = t.pending
        ? '<p class="atext dots"><span></span><span></span><span></span></p>'
        : '<p class="atext' + (t.err ? " err" : "") + '">' + esc(t.a) + '</p>';
      return '<div class="turn"><p class="you">' + esc(t.q) + '</p>' +
        '<div class="said">' + BOT + answer + '</div></div>';
    }).join("");
    thread.scrollTop = thread.scrollHeight;
  }
  function reset() {
    turns = []; done = []; spot = null; open = {};
    F.type = "all"; F.aud = "all"; F.win = "all";
    pressed();
    drawThread();
    render();
  }
  function lock(message) {
    pass = "";
    reset();
    try { localStorage.removeItem("fbr_pass"); } catch (e) {}
    gpass.value = "";
    gerr.textContent = message || "";
    page.hidden = true;
    gate.hidden = false;
  }
  function doAsk(text) {
    var question = (text || qbox.value).trim();
    if (!question) { return; }
    qbox.value = "";
    var turn = { q: question, a: "", pending: 1 };
    turns.push(turn);
    drawThread();
    fetch(D.ask_url, {
      method: "POST", headers: HEADERS,
      body: JSON.stringify({ question: question, passphrase: pass, history: done.slice(-6) })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (r.status === 403) { throw { locked: 1 }; }
        if (!r.ok) { throw new Error(j.error || "the agent could not answer that"); }
        return j;
      });
    }).then(function (j) {
      turn.pending = 0;
      turn.a = j.answer || "";
      done.push({ q: question, a: turn.a });
      spot = j.themes && j.themes.length ? j.themes : null;
      if (spot) { open = {}; spot.forEach(function (id) { open[id] = 1; }); }
      drawThread();
      render();
    }).catch(function (e) {
      if (e && e.locked) {
        turns.pop();
        lock("That passphrase is no longer accepted. Enter it again to carry on.");
        return;
      }
      turn.pending = 0;
      turn.a = "No answer came back: " + e.message + ". Send the question again.";
      turn.err = 1;
      drawThread();
    });
  }
  function check(value) {
    gerr.textContent = "Checking the passphrase.";
    fetch(D.ask_url, {
      method: "POST", headers: HEADERS,
      body: JSON.stringify({ question: "", passphrase: value })
    }).then(function (r) {
      return r.json().then(function (j) { return { code: r.status, body: j }; });
    }).then(function (res) {
      if (res.code === 400) {
        pass = value;
        try { localStorage.setItem("fbr_pass", value); } catch (e) {}
        gerr.textContent = "";
        gate.hidden = true;
        page.hidden = false;
        return;
      }
      gerr.textContent = res.code === 403
        ? "That passphrase was not accepted. Check it against the email and try again."
        : res.body.error || "Could not check the passphrase. Try again in a moment.";
    }).catch(function () {
      gerr.textContent = "Could not reach the digest to check the passphrase. " +
        "Check your connection and try again.";
    });
  }
  document.getElementById("gateform").addEventListener("submit", function (e) {
    e.preventDefault();
    if (gpass.value.trim()) { check(gpass.value.trim()); }
  });
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest(".opt");
    if (!b) { return; }
    F[b.dataset.f] = b.dataset.v;
    pressed();
    render();
  });
  list.addEventListener("click", function (e) {
    var r = e.target.closest(".row");
    if (!r) { return; }
    var id = r.dataset.id;
    if (open[id]) { delete open[id]; } else { open[id] = 1; }
    render();
  });
  note.addEventListener("click", function (e) {
    if (e.target.id === "showall") { spot = null; open = {}; render(); }
  });
  thread.addEventListener("click", function (e) {
    if (e.target.classList.contains("chip")) { doAsk(e.target.textContent); }
  });
  document.getElementById("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    doAsk();
  });
  document.getElementById("restart").addEventListener("click", reset);
  if (D.ask_url) {
    pane.hidden = false;
    try { pass = localStorage.getItem("fbr_pass") || ""; } catch (e) {}
    page.hidden = true;
    gate.hidden = false;
    if (pass) { check(pass); }
    drawThread();
  }
  counts();
  ranks();
  pressed();
  render();
})();
</script>
</body>
</html>
