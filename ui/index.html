<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature / Bug Requests</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root {
  --ink:#1B1F24; --sec:#5B6470; --faint:#8A93A0; --line:#DCE0E5; --accent:#0F6E56;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
* { box-sizing:border-box; }
body { margin:0; background:#fff; color:var(--ink); font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
h1 { margin:0; font:500 34px/1.2 var(--serif); letter-spacing:-0.01em; }
.send { padding:8px 16px; border:0; border-radius:6px; background:var(--accent);
  color:#fff; font:500 13px var(--sans); cursor:pointer; }
.send:hover { background:#0C5A46; }
.field { width:100%; padding:8px 0; border:0; border-bottom:1px solid var(--line);
  background:none; font:400 14px var(--sans); color:var(--ink); }
.field::placeholder { color:var(--faint); }
.field:focus { border-bottom-color:var(--sec); }
.gate { max-width:430px; margin:0 auto; padding:16vh 24px 0; }
.gate[hidden] { display:none; }
.gate h1 { font-size:30px; }
.gatenote { margin:14px 0 30px; color:var(--sec); font-size:15px; }
.gateform { display:flex; gap:12px; align-items:center; }
.gateform .field { flex:1 1 auto; min-width:0; }
.gateerr { min-height:20px; margin:18px 0 0; color:#8A1F1F; font-size:13px; }
.page { display:flex; gap:44px; align-items:flex-start;
  max-width:1420px; margin:0 auto; padding:52px 32px 96px; }
.page[hidden] { display:none; }
.digest { flex:1 1 auto; min-width:0; }
.lede { max-width:64ch; margin:14px 0 0; color:var(--sec); font-size:16px; }
.filters { display:flex; flex-wrap:wrap; gap:14px 30px; align-items:center;
  margin-top:30px; padding:18px 0; border-top:1px solid var(--line);
  border-bottom:1px solid var(--line); }
.fgroup { display:flex; gap:10px; align-items:center; }
.flabel { color:var(--faint); font-size:13px; }
.seg { display:flex; gap:6px; }
.opt { padding:5px 11px; border:1px solid var(--line); border-radius:6px; background:#fff;
  font:400 13px var(--sans); color:var(--sec); cursor:pointer; }
.opt:hover { border-color:var(--sec); }
.opt[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
.head, .row { display:grid; gap:14px; align-items:baseline;
  grid-template-columns:24px minmax(0,1fr) 70px 108px 40px 88px 70px 64px; }
.head { padding:18px 6px 10px; border-bottom:1px solid var(--line);
  color:var(--faint); font-size:12px; }
.head span { white-space:nowrap; }
.head span:last-child { text-align:right; }
.row { width:100%; padding:16px 6px; text-align:left; background:none; color:inherit;
  font:inherit; border:0; border-bottom:1px solid var(--line); cursor:pointer; }
.row:hover { background:#FAFBFC; }
.rank { color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums; }
.cell { min-width:0; }
.title { display:block; font:400 18px/1.35 var(--serif); }
.sub { display:block; margin-top:5px; color:var(--sec); font-size:14px;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.row[aria-expanded="true"] .sub { display:none; }
.accts, .num, .srcs, .when { color:var(--sec); font-size:13px; }
.num { font-variant-numeric:tabular-nums; }
.score { font-size:15px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.bar { display:block; width:64px; height:4px; margin:7px 0 0 auto;
  border-radius:2px; background:var(--line); }
.bar i { display:block; height:100%; border-radius:2px; background:var(--accent); }
.pill { justify-self:start; padding:3px 9px; border-radius:4px;
  font-size:12px; text-transform:capitalize; }
.bug { background:#FBEAEA; color:#8A1F1F; }
.feature { background:#E9ECF9; color:#2E3A8C; }
.detail { padding:6px 6px 36px 38px; border-bottom:1px solid var(--line); }
.summary { max-width:64ch; margin:0 0 20px; }
.math { margin:0 0 26px; overflow-x:auto; white-space:nowrap;
  color:var(--sec); font:400 12px/1.6 var(--mono); }
.claim { max-width:66ch; margin:0 0 24px; padding-left:18px; border-left:2px solid var(--line); }
.quote { margin:0 0 10px; }
.meta { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center;
  color:var(--sec); font-size:13px; }
.who { color:var(--ink); }
.tag { padding:2px 8px; border:1px solid var(--line); border-radius:999px; font-size:12px; }
.customer { color:var(--accent); }
.prospect { color:var(--sec); }
.src { color:var(--sec); font-size:12.5px;
  text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
.log { max-width:92ch; margin-top:28px; padding-top:16px;
  border-top:1px solid var(--line); color:var(--faint); font-size:12.5px; }
.log div { display:grid; grid-template-columns:56px 66px 1fr; gap:12px; margin-top:6px; }
.empty { padding:32px 6px; color:var(--sec); }
.spot { display:flex; flex-wrap:wrap; gap:14px; align-items:baseline;
  margin:0; padding:18px 6px 0; color:var(--sec); font-size:13px; }
.spot button { padding:0; border:0; background:none; font:400 13px var(--sans);
  color:var(--accent); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
.ask { flex:0 0 400px; display:flex; flex-direction:column; position:sticky; top:24px;
  max-height:calc(100vh - 48px); padding:20px; border-radius:12px; background:#F3F5F7; }
.ask[hidden] { display:none; }
.askhead { display:flex; gap:12px; align-items:baseline; justify-content:space-between; }
.asktitle { margin:0; font:500 15px var(--sans); }
.reset { padding:0; border:0; background:none; font:400 13px var(--sans);
  color:var(--sec); cursor:pointer; }
.reset:hover { text-decoration:underline; text-decoration-color:var(--line);
  text-underline-offset:3px; }
.asknote { margin:6px 0 18px; color:var(--faint); font-size:13px; }
.thread { flex:1 1 auto; min-height:0; overflow-y:auto; padding-bottom:18px; }
.chip { display:block; width:100%; margin-bottom:8px; padding:8px 14px; text-align:left;
  border:1px solid var(--line); border-radius:999px; background:none;
  font:400 13.5px var(--sans); color:var(--ink); cursor:pointer; }
.chip:hover { border-color:var(--sec); }
.turn + .turn { margin-top:24px; }
.bubble { max-width:88%; margin-left:auto; padding:9px 14px; border-radius:12px;
  background:#E4E8EC; color:var(--ink); font-size:14px; }
.atext { margin:14px 2px 0; font-size:14px; line-height:1.6; white-space:pre-wrap; }
.atext.err { color:#8A1F1F; }
.pending { margin:14px 2px 0; color:var(--sec); font-size:14px; }
.composer { display:flex; gap:10px; align-items:center; padding-top:14px; }
.composer .field { flex:1 1 auto; min-width:0; }
@media (max-width:900px) {
  .page { display:block; padding:44px 24px 80px; }
  h1 { font-size:28px; }
  .head { display:none; }
  .row { grid-template-columns:22px minmax(0,1fr) 70px 64px; }
  .row .accts, .row .num, .row .srcs, .row .when { display:none; }
  .detail { padding-left:22px; }
  .ask { position:static; max-height:none; margin-top:40px; }
  .thread { overflow:visible; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <h1>Feature / Bug Requests</h1>
  <p class="gatenote">Enter the passphrase from the email to open the digest.</p>
  <form class="gateform" id="gateform">
    <input class="field" id="gpass" type="password" placeholder="Passphrase"
      autocomplete="current-password">
    <button class="send" type="submit">Open</button>
  </form>
  <p class="gateerr" id="gateerr"></p>
</div>
<div class="page" id="page">
 <div class="digest">
  <h1>Feature / Bug Requests</h1>
  <p class="lede" id="lede"></p>
  <div class="filters" id="filters">
   <div class="fgroup"><span class="flabel">Type</span><span class="seg">
    <button class="opt" data-f="type" data-v="all">All</button>
    <button class="opt" data-f="type" data-v="bug">Bug</button>
    <button class="opt" data-f="type" data-v="feature">Feature</button>
   </span></div>
   <div class="fgroup"><span class="flabel">Audience</span><span class="seg">
    <button class="opt" data-f="aud" data-v="all">All</button>
    <button class="opt" data-f="aud" data-v="customer">Customers</button>
    <button class="opt" data-f="aud" data-v="prospect">Prospects</button>
   </span></div>
   <div class="fgroup"><span class="flabel">Window</span><span class="seg">
    <button class="opt" data-f="win" data-v="7">Last 7 days</button>
    <button class="opt" data-f="win" data-v="30">Last 30 days</button>
    <button class="opt" data-f="win" data-v="all">All time</button>
   </span></div>
  </div>
  <div id="spot"></div>
  <div class="head">
   <span>#</span><span>Theme</span><span>Type</span><span>Accounts</span>
   <span>Cases</span><span>Sources</span><span>Last heard</span><span>Score</span>
  </div>
  <div id="list"></div>
 </div>
 <aside class="ask" id="ask" hidden>
  <div class="askhead">
   <p class="asktitle">Ask</p>
   <button class="reset" id="reset" type="button">Reset</button>
  </div>
  <p class="asknote">Answers come only from the themes on this page.</p>
  <div class="thread" id="thread"></div>
  <form class="composer" id="composer">
   <input class="field" id="q" type="text" maxlength="500" placeholder="Ask about these themes">
   <button class="send" type="submit">Send</button>
  </form>
 </aside>
</div>
<script src="data.js"></script>
<script>
(function () {
  var D = window.DIGEST, F = { type: "all", aud: "all", win: "all" };
  var open = {}, spot = null, turns = [], done = [], pass = "";
  var list = document.getElementById("list"), note = document.getElementById("spot");
  var gate = document.getElementById("gate"), page = document.getElementById("page");
  var gpass = document.getElementById("gpass"), gerr = document.getElementById("gateerr");
  var pane = document.getElementById("ask"), qbox = document.getElementById("q");
  var thread = document.getElementById("thread");
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var CHIPS = ["What should we fix first?", "What are prospects asking for?",
    "Which bug affects the most accounts?"];
  var HEADERS = { "content-type": "application/json" };
  var q = (location.search.match(/[?&]open=([^&]+)/) || [])[1];
  if (q) { open[decodeURIComponent(q)] = 1; }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
    });
  }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
  function parts(d) { var p = d.split("-"); return [+p[0], +p[1], +p[2]]; }
  function fday(d) { var p = parts(d); return MON[p[1] - 1] + " " + p[2]; }
  function fdate(d) { var p = parts(d); return MON[p[1] - 1] + " " + p[2] + ", " + p[0]; }
  function age(d) {
    var a = parts(d), b = parts(D.as_of);
    return Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
  }
  function keep(c) {
    if (F.aud !== "all" && c.account_type !== F.aud) { return false; }
    if (F.win !== "all" && age(c.day) > +F.win) { return false; }
    return true;
  }
  function accounts(claims) {
    var seen = { customer: {}, prospect: {} }, out = [];
    claims.forEach(function (c) { var b = seen[c.account_type]; if (b) { b[c.account_id] = 1; } });
    var cu = Object.keys(seen.customer).length, pr = Object.keys(seen.prospect).length;
    if (cu) { out.push(plural(cu, "customer")); }
    if (pr) { out.push(plural(pr, "prospect")); }
    return out.join(", ");
  }
  function sources(claims) {
    var calls = {}, cases = {}, out = [];
    claims.forEach(function (c) {
      var l = c.locator;
      if (l.call_id) { calls[l.call_id] = 1; } else { cases[l.case_id] = 1; }
    });
    var a = Object.keys(calls).length, b = Object.keys(cases).length;
    if (a) { out.push(plural(a, "call")); }
    if (b) { out.push(plural(b, "case")); }
    return out.join(", ");
  }
  function lastHeard(claims) {
    return fday(claims.map(function (c) { return c.day; }).sort().pop());
  }
  function math(t) {
    return Object.keys(t.score_parts).map(function (k) {
      return k + " " + t.score_parts[k].toFixed(1);
    }).join(" + ") + " = " + t.score;
  }
  function source(c) {
    var l = c.locator;
    if (l.call_id) {
      var s = Math.floor(l.start_ms / 1000);
      return "call " + l.call_id + " at " + Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
    }
    return "case " + (l.case_number || l.case_id) + ", comment " + l.comment_id;
  }
  function claimHtml(c) {
    var tag = c.account_type === "customer" ? "customer" : "prospect";
    return '<div class="claim"><p class="quote">“' + esc(c.quote) + '”</p>' +
      '<p class="meta"><span class="who">' + esc(c.account) + '</span>' +
      '<span class="tag ' + tag + '">' + tag + '</span>' +
      '<span>' + esc(c.speaker) + '</span><span>' + fday(c.day) + '</span>' +
      '<span class="src">' + esc(source(c)) + '</span></p></div>';
  }
  function detailHtml(t, claims) {
    var logs = (t.log || []).map(function (e) {
      return '<div><span>' + fday(e.day) + '</span><span>' + esc(e.action) + '</span>' +
        '<span>' + esc(e.why) + '</span></div>';
    }).join("");
    return '<div class="detail"><p class="summary">' + esc(t.summary) + '</p>' +
      '<p class="math">' + esc(math(t)) + '</p>' + claims.map(claimHtml).join("") +
      (logs ? '<div class="log">' + logs + '</div>' : "") + '</div>';
  }
  function rowHtml(v, i, top) {
    var t = v.t, isOpen = !!open[t.id];
    return '<button class="row" data-id="' + esc(t.id) + '" aria-expanded="' + isOpen + '">' +
      '<span class="rank">' + (i + 1) + '</span>' +
      '<span class="cell"><span class="title">' + esc(t.title) + '</span>' +
      '<span class="sub">' + esc(t.summary) + '</span></span>' +
      '<span class="pill ' + esc(t.type) + '">' + esc(t.type) + '</span>' +
      '<span class="accts">' + accounts(v.claims) + '</span>' +
      '<span class="num">' + (t.open_cases || 0) + '</span>' +
      '<span class="srcs">' + sources(v.claims) + '</span>' +
      '<span class="when">' + lastHeard(v.claims) + '</span>' +
      '<span class="score">' + t.score + '<span class="bar"><i style="width:' +
      Math.round(t.score / top * 100) + '%"></i></span></span>' +
      '</button>' + (isOpen ? detailHtml(t, v.claims) : "");
  }
  function spotted(t) { return spot && spot.indexOf(t.id) > -1; }
  function drawNote() {
    if (!spot) { note.innerHTML = ""; return; }
    var n = D.themes.filter(spotted).length;
    note.innerHTML = '<p class="spot"><span>Showing the ' +
      (n === 1 ? "theme" : n + " themes") + ' this answer drew on</span>' +
      '<button id="showall">show all</button></p>';
  }
  function render() {
    var vis = [];
    drawNote();
    D.themes.slice().sort(function (a, b) { return b.score - a.score; }).forEach(function (t) {
      if (spot && !spotted(t)) { return; }
      if (F.type !== "all" && t.type !== F.type) { return; }
      var claims = (t.claims || []).filter(keep);
      if (claims.length) { vis.push({ t: t, claims: claims }); }
    });
    var top = vis.length ? vis[0].t.score || 1 : 1;
    list.innerHTML = vis.map(function (v, i) { return rowHtml(v, i, top); }).join("") ||
      '<p class="empty">No themes match these filters. Widen the window or clear a filter.</p>';
  }
  function pressed() {
    [].forEach.call(document.querySelectorAll(".opt"), function (o) {
      o.setAttribute("aria-pressed", F[o.dataset.f] === o.dataset.v);
    });
  }
  function lede() {
    var claims = 0, accts = {};
    D.themes.forEach(function (t) {
      (t.claims || []).forEach(function (c) { claims++; accts[c.account_id] = 1; });
    });
    document.getElementById("lede").textContent = plural(D.themes.length, "theme") +
      " from " + plural(claims, "claim") + " across " +
      plural(Object.keys(accts).length, "account") + ", as of " + fdate(D.as_of) + ".";
  }
  function drawThread() {
    if (!turns.length) {
      thread.innerHTML = CHIPS.map(function (c) {
        return '<button class="chip" type="button">' + esc(c) + '</button>';
      }).join("");
      return;
    }
    thread.innerHTML = turns.map(function (t) {
      var answer = t.pending ? '<p class="pending">Thinking...</p>'
        : '<p class="atext' + (t.err ? " err" : "") + '">' + esc(t.a) + '</p>';
      return '<div class="turn"><div class="bubble">' + esc(t.q) + '</div>' + answer + '</div>';
    }).join("");
    thread.scrollTop = thread.scrollHeight;
  }
  function lock(message) {
    pass = ""; turns = []; done = []; spot = null;
    try { localStorage.removeItem("fbr_pass"); } catch (e) {}
    gpass.value = "";
    gerr.textContent = message || "";
    page.hidden = true;
    gate.hidden = false;
  }
  function doAsk(text) {
    var question = (text || qbox.value).trim();
    if (!question) { return; }
    qbox.value = "";
    var turn = { q: question, a: "", pending: 1 };
    turns.push(turn);
    drawThread();
    fetch(D.ask_url, {
      method: "POST", headers: HEADERS,
      body: JSON.stringify({ question: question, passphrase: pass, history: done.slice(-6) })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (r.status === 403) { throw { locked: 1 }; }
        if (!r.ok) { throw new Error(j.error || "request failed"); }
        return j;
      });
    }).then(function (j) {
      turn.pending = 0;
      turn.a = j.answer || "";
      done.push({ q: question, a: turn.a });
      spot = j.themes && j.themes.length ? j.themes : null;
      if (spot) { open = {}; spot.forEach(function (id) { open[id] = 1; }); }
      drawThread();
      render();
    }).catch(function (e) {
      if (e && e.locked) { turns.pop(); drawThread(); lock("Wrong passphrase"); return; }
      turn.pending = 0;
      turn.a = "Could not answer: " + e.message;
      turn.err = 1;
      drawThread();
    });
  }
  function check(value) {
    gerr.textContent = "Checking...";
    fetch(D.ask_url, {
      method: "POST", headers: HEADERS,
      body: JSON.stringify({ question: "", passphrase: value })
    }).then(function (r) {
      return r.json().then(function (j) { return { code: r.status, body: j }; });
    }).then(function (res) {
      if (res.code === 400) {
        pass = value;
        try { localStorage.setItem("fbr_pass", value); } catch (e) {}
        gerr.textContent = "";
        gate.hidden = true;
        page.hidden = false;
        return;
      }
      gerr.textContent = res.code === 403 ? "Wrong passphrase"
        : res.body.error || "Could not check the passphrase";
    }).catch(function (e) {
      gerr.textContent = "Could not check the passphrase: " + e.message;
    });
  }
  document.getElementById("gateform").addEventListener("submit", function (e) {
    e.preventDefault();
    if (gpass.value.trim()) { check(gpass.value.trim()); }
  });
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest(".opt");
    if (!b) { return; }
    F[b.dataset.f] = b.dataset.v;
    pressed();
    render();
  });
  list.addEventListener("click", function (e) {
    var r = e.target.closest(".row");
    if (!r) { return; }
    var id = r.dataset.id;
    if (open[id]) { delete open[id]; } else { open[id] = 1; }
    render();
  });
  note.addEventListener("click", function (e) {
    if (e.target.id === "showall") { spot = null; render(); }
  });
  thread.addEventListener("click", function (e) {
    if (e.target.classList.contains("chip")) { doAsk(e.target.textContent); }
  });
  document.getElementById("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    doAsk();
  });
  document.getElementById("reset").addEventListener("click", function () {
    turns = [];
    done = [];
    spot = null;
    drawThread();
    render();
  });
  if (D.ask_url) {
    pane.hidden = false;
    try { pass = localStorage.getItem("fbr_pass") || ""; } catch (e) {}
    page.hidden = true;
    gate.hidden = false;
    if (pass) { check(pass); }
    drawThread();
  }
  lede();
  pressed();
  render();
})();
</script>
</body>
</html>
